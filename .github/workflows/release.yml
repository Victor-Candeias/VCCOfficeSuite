name: Official Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      test_self_signed:
        description: 'Test repository self-signed PFX on Windows (no public release)'
        type: boolean
        required: false
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: win-x64
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-15
            name: macos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, re
          version = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit("Invalid release tag: " + version)
      - name: Stamp official release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os
          version = os.environ["GITHUB_REF_NAME"][1:]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("VCC_RELEASE_VERSION=" + version + chr(10))
      - name: Verify final release prerequisites
        run: python scripts/check-final-release-readiness.py
      - name: Verify host/plugin boundaries
        run: python scripts/check-host-plugin-boundaries.py
      - name: Verify retired WPF
        run: python scripts/check-wpf-retirement.py
      - name: Release-security unit tests
        run: python -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Restore
        run: dotnet restore VCC.Office.Avalonia.sln
      - name: Scan NuGet dependency advisories
        shell: bash
        run: |
          dotnet package list --project VCC.Office.Avalonia.sln --include-transitive --vulnerable --no-restore --format json > nuget-audit.json
          python scripts/release_security.py audit nuget-audit.json
      - name: Build Release
        run: dotnet build VCC.Office.Avalonia.sln --configuration Release --no-restore --property:ContinuousIntegrationBuild=true
      - name: CoreShell tests
        run: dotnet run --project tests/Vcc.Office.CoreShell.Tests/Vcc.Office.CoreShell.Tests.csproj --configuration Release
      - name: Avalonia headless smoke tests
        run: dotnet run --project tests/Vcc.Office.Desktop.SmokeTests/Vcc.Office.Desktop.SmokeTests.csproj --configuration Release
      - name: Publish Windows x64 self-contained
        if: matrix.name == 'win-x64'
        run: dotnet publish src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishTrimmed=false --property:PublishSingleFile=false --output artifacts/release
      - name: Publish Linux/macOS
        if: matrix.name != 'win-x64'
        run: dotnet publish src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration Release --no-restore --self-contained false --property:PublishTrimmed=false --output artifacts/release
      - name: Include independently discovered plugins
        run: python scripts/stage-office-plugins.py artifacts/release Release
      - name: Verify plugin payload
        run: python scripts/check-writer-plugin-package.py artifacts/release
      - name: Sign and verify Windows binaries (required for published tags)
        if: matrix.name == 'win-x64' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.test_self_signed == true && runner.environment == 'github-hosted'))
        shell: pwsh
        env:
          SELF_SIGNED_TEST: ${{ inputs.test_self_signed }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isRelease = $env:GITHUB_REF -like 'refs/tags/v*'
          $validationMode = if ($isRelease) { 'TrustedRelease' } else { 'SelfSignedTest' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'Windows signing secrets are required for the selected signing validation.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP ('vcc-signing-' + [Guid]::NewGuid().ToString('N') + '.pfx')
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $tool = Get-ChildItem $sdk -Recurse -File -Filter signtool.exe |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $tool) { throw 'Windows SDK signtool.exe not found.' }
            $targets = @(Join-Path 'artifacts/release' 'VCC Office Suite.exe')
            $targets += @(Get-ChildItem 'artifacts/release/Plugins' -Recurse -File -Filter 'Vcc.Office.*.dll' | Select-Object -ExpandProperty FullName)
            foreach ($target in $targets) {
              if ($isRelease) {
                & $tool.FullName sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $target
              } else {
                & $tool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $target
              }
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $target" }
              & ./scripts/verify-code-signature.ps1 -FilePath $target -PfxPath $pfxPath -Mode $validationMode
              if (-not $?) { throw "Signature verification failed for $target" }
              Write-Host "PASS signed $target in $validationMode mode"
            }
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Package and internally verify SHA-256 manifests
        shell: bash
        run: |
          python scripts/release_security.py pack --source artifacts/release --output "dist/VCCOfficeSuite-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ matrix.name }}.zip"
          python scripts/check-final-release-readiness.py --archive "dist/VCCOfficeSuite-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ matrix.name }}.zip"
      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: official-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified GitHub Release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify version tag belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must reference a commit on main"
            exit 1
          }
      - uses: actions/download-artifact@v7
        with:
          pattern: official-*
          path: dist
          merge-multiple: true
      - name: Verify number of release archives and write SHA256SUMS
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          python scripts/release_security.py checksums --directory dist --output dist/SHA256SUMS.txt
          for file in dist/*.zip; do
            python scripts/release_security.py verify "$file"
          done
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "VCC Office Suite $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Windows binaries were signed and verified with Authenticode. Verify SHA256SUMS.txt before extraction. Signatures and checksums do not guarantee absence of malware."
