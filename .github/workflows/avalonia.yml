name: Avalonia Cross-Platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }} - ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore Avalonia and shared Core
        run: dotnet restore src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj
      - name: Build Avalonia
        run: dotnet build src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration ${{ matrix.configuration }} --no-restore --property:ContinuousIntegrationBuild=true
      - name: Test shared CoreShell
        run: dotnet run --project tests/Vcc.Office.CoreShell.Tests/Vcc.Office.CoreShell.Tests.csproj --configuration ${{ matrix.configuration }}
      - name: Publish desktop
        run: dotnet publish src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration ${{ matrix.configuration }} --no-restore --self-contained false --property:PublishTrimmed=false --output artifacts/desktop
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: VCCOfficeDesktop-${{ matrix.os }}-${{ matrix.configuration }}
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 14
