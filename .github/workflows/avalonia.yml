name: Avalonia Cross-Platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }} - Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify WPF retirement safety gate
        run: python scripts/check-wpf-retirement.py
      - name: Verify plugin boundaries
        run: python scripts/check-host-plugin-boundaries.py
      - name: Verify release checksum and packaging security tests
        run: python -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Restore canonical Avalonia solution
        run: dotnet restore VCC.Office.Avalonia.sln
      - name: Audit NuGet dependencies for known vulnerabilities
        run: |
          dotnet package list --project VCC.Office.Avalonia.sln --include-transitive --vulnerable --no-restore --format json > nuget-audit.json
          python scripts/release_security.py audit nuget-audit.json
      - name: Build canonical Avalonia solution
        run: dotnet build VCC.Office.Avalonia.sln --configuration Release --no-restore --property:ContinuousIntegrationBuild=true
      - name: Test shared CoreShell
        run: dotnet run --project tests/Vcc.Office.CoreShell.Tests/Vcc.Office.CoreShell.Tests.csproj --configuration Release
      - name: Smoke test Avalonia visual tree without display server
        run: dotnet run --project tests/Vcc.Office.Desktop.SmokeTests/Vcc.Office.Desktop.SmokeTests.csproj --configuration Release
      # Linux and macOS each compile, test and publish a single Release build.
      # Windows performs the same checks before creating its standalone package.
      - name: Publish desktop (Linux/macOS Release only)
        run: dotnet publish src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration Release --no-restore --self-contained false --property:PublishTrimmed=false --output artifacts/desktop
      - name: Stage discovered plugin DLLs (Linux/macOS)
        run: python scripts/stage-office-plugins.py artifacts/desktop Release
      - name: Verify Writer plugin in Linux/macOS release
        run: python scripts/check-writer-plugin-package.py artifacts/desktop
      - name: Upload Linux/macOS Release artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: VCCOfficeDesktop-${{ matrix.os }}-Release
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 14

  windows-standalone:
    name: Windows - Release
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify WPF retirement safety gate
        run: python scripts/check-wpf-retirement.py
      - name: Verify plugin boundaries
        run: python scripts/check-host-plugin-boundaries.py
      - name: Verify release checksum and packaging security tests
        run: python -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Restore canonical Avalonia solution
        run: dotnet restore VCC.Office.Avalonia.sln
      - name: Build canonical Avalonia solution (Release)
        run: dotnet build VCC.Office.Avalonia.sln --configuration Release --no-restore --property:ContinuousIntegrationBuild=true
      - name: Test shared CoreShell (Release)
        run: dotnet run --project tests/Vcc.Office.CoreShell.Tests/Vcc.Office.CoreShell.Tests.csproj --configuration Release
      - name: Smoke test Avalonia visual tree without display server (Release)
        run: dotnet run --project tests/Vcc.Office.Desktop.SmokeTests/Vcc.Office.Desktop.SmokeTests.csproj --configuration Release
      - name: Publish standalone Windows x64 (includes .NET runtime)
        run: dotnet publish src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishTrimmed=false --property:PublishSingleFile=false --output artifacts/windows-standalone
      - name: Stage discovered plugin DLLs (Windows)
        run: python scripts/stage-office-plugins.py artifacts/windows-standalone Release
      - name: Verify Writer plugin in Windows standalone release
        run: python scripts/check-writer-plugin-package.py artifacts/windows-standalone
      - name: Verify runtime is included
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifacts/windows-standalone/coreclr.dll')) {
            throw 'Self-contained publish failed: coreclr.dll is missing.'
          }
          if (-not (Test-Path 'artifacts/windows-standalone/VCC Office Suite.exe')) {
            throw 'Windows executable missing.'
          }
      - name: Upload standalone Windows x64 artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: VCCOfficeDesktop-Windows11-x64-Standalone-Release
          path: artifacts/windows-standalone/
          if-no-files-found: error
          retention-days: 14
