name: Avalonia Cross-Platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }} - ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify WPF retirement safety gate
        run: python scripts/check-wpf-retirement.py
      - name: Restore canonical Avalonia solution
        run: dotnet restore VCC.Office.sln
      - name: Build canonical Avalonia solution
        run: dotnet build VCC.Office.sln --configuration ${{ matrix.configuration }} --no-restore --property:ContinuousIntegrationBuild=true
      - name: Test shared CoreShell
        run: dotnet run --project tests/Vcc.Office.CoreShell.Tests/Vcc.Office.CoreShell.Tests.csproj --configuration ${{ matrix.configuration }}
      - name: Smoke test Avalonia visual tree without display server
        run: dotnet run --project tests/Vcc.Office.Desktop.SmokeTests/Vcc.Office.Desktop.SmokeTests.csproj --configuration ${{ matrix.configuration }}
      # All OS/configurations still build and run tests. Package only Release
      # for Linux/macOS; the Windows installer package is built below.
      - name: Publish desktop (Linux/macOS Release only)
        if: matrix.configuration == 'Release' && runner.os != 'Windows'
        run: dotnet publish src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration Release --no-restore --self-contained false --property:PublishTrimmed=false --output artifacts/desktop
      - name: Upload Linux/macOS Release artifact
        if: matrix.configuration == 'Release' && runner.os != 'Windows' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: VCCOfficeDesktop-${{ matrix.os }}-Release
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 14

  windows-standalone:
    name: Windows 11 x64 - Release standalone
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify WPF retirement safety gate
        run: python scripts/check-wpf-retirement.py
      - name: Publish standalone Windows x64 (includes .NET runtime)
        run: dotnet publish src/Vcc.Office.Desktop/Vcc.Office.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishTrimmed=false --property:PublishSingleFile=false --output artifacts/windows-standalone
      - name: Verify runtime is included
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifacts/windows-standalone/coreclr.dll')) {
            throw 'Self-contained publish failed: coreclr.dll is missing.'
          }
          if (-not (Test-Path 'artifacts/windows-standalone/VCC Office Suite.exe')) {
            throw 'Windows executable missing.'
          }
      - name: Upload standalone Windows x64 artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: VCCOfficeDesktop-Windows11-x64-Standalone-Release
          path: artifacts/windows-standalone/
          if-no-files-found: error
          retention-days: 14
