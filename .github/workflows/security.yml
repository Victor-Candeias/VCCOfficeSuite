name: Security Review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL C# analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build canonical solution for static security analysis
        run: |
          dotnet restore VCC.Office.Avalonia.sln
          dotnet build VCC.Office.Avalonia.sln --configuration Release --no-restore
      - name: Analyze C# security patterns
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
